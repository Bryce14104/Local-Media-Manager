name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ort 2.0.0-rc.15 dropped Intel macOS and requires macOS 13.4+.
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          # ort's Linux prebuilts need glibc 2.38+ (Ubuntu 24.04).
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Match ort's macOS floor (13.4+) for CoreML / compiler-rt linkage.
      - name: Set macOS deployment target
        if: matrix.platform == 'macos-latest'
        run: echo "MACOSX_DEPLOYMENT_TARGET=13.4" >> "$GITHUB_ENV"

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Shelf ${{ github.ref_name }}
          releaseBody: |
            Shelf is an **unsigned beta**. Your OS will warn you the first time you open it — that is expected.

            ### macOS — “Shelf is damaged and can’t be opened”
            1. Drag **Shelf.app** into **Applications**.
            2. Open **Terminal** and run:

            ```
            xattr -cr "/Applications/Shelf.app"
            ```

            3. Open Shelf from Applications.

            ### Windows — SmartScreen / “Windows protected your PC”
            1. Run the installer (or `Shelf.exe`).
            2. Click **More info**.
            3. Click **Run anyway**.

            ### Linux — AppImage
            ```
            chmod +x Shelf*.AppImage
            ./Shelf*.AppImage
            ```

            ### Feedback
            https://tally.so
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
