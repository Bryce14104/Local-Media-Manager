name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon — ort ships aarch64 macOS 13.4+ prebuilts.
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            ort_custom: false
          # Intel Mac — ort dropped x86_64 prebuilts; link a public static ORT 1.23.2.
          - platform: macos-15-intel
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            ort_custom: true
          # ort's Linux prebuilts need glibc 2.38+ (Ubuntu 24.04).
          - platform: ubuntu-24.04
            rust_target: ""
            args: ""
            ort_custom: false
          - platform: windows-latest
            rust_target: ""
            args: ""
            ort_custom: false

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Match ort's macOS floor (13.4+) for CoreML / compiler-rt linkage.
      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=13.4" >> "$GITHUB_ENV"

      - name: Cache Intel ONNX Runtime static library
        if: matrix.ort_custom
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/onnxruntime-x86_64
          key: ort-1.23.2-macos-x86_64-static-hf-v1

      # No git clone — GitHub Actions credentials break public clones of microsoft/onnxruntime.
      # Use the last published Intel macOS static lib (Hugging Face mirror).
      - name: Download Intel ONNX Runtime 1.23.2 static library
        if: matrix.ort_custom && steps.ort-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/onnxruntime-x86_64"
          curl -fsSL --retry 5 --retry-all-errors \
            -o "${{ runner.temp }}/ort-intel.zip" \
            "https://huggingface.co/csukuangfj/onnxruntime-libs/resolve/main/1.23.2/onnxruntime-osx-x86_64-static_lib-1.23.2.zip"
          unzip -q "${{ runner.temp }}/ort-intel.zip" -d "${{ runner.temp }}/ort-intel-unpack"
          # ort-sys links libonnxruntime.a when it sits directly in ORT_LIB_PATH.
          cp "${{ runner.temp }}/ort-intel-unpack/onnxruntime-osx-x86_64-static_lib-1.23.2/lib/libonnxruntime.a" \
            "${{ runner.temp }}/onnxruntime-x86_64/libonnxruntime.a"
          ls -lh "${{ runner.temp }}/onnxruntime-x86_64/libonnxruntime.a"

      - name: Point ort at the Intel ONNX Runtime library
        if: matrix.ort_custom
        run: |
          echo "ORT_LIB_PATH=${{ runner.temp }}/onnxruntime-x86_64" >> "$GITHUB_ENV"

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Shelf ${{ github.ref_name }}
          releaseBody: |
            Shelf is an **unsigned beta**. Your OS will warn you the first time you open it — that is expected.

            ### macOS downloads
            - **Apple Silicon (M1 / M2 / M3 / M4):** use the `aarch64` / `apple-silicon` asset.
            - **Intel Mac:** use the `x64` / `x86_64` asset.

            ### macOS — “Shelf is damaged and can’t be opened”
            1. Drag **Shelf.app** into **Applications**.
            2. Open **Terminal** and run:

            ```
            xattr -cr "/Applications/Shelf.app"
            ```

            3. Open Shelf from Applications.

            ### Windows — SmartScreen / “Windows protected your PC”
            1. Run the installer (or `Shelf.exe`).
            2. Click **More info**.
            3. Click **Run anyway**.

            ### Linux — AppImage
            ```
            chmod +x Shelf*.AppImage
            ./Shelf*.AppImage
            ```

            ### Feedback
            https://tally.so/r/9N76BG
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
