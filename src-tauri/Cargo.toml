[package]
name = "shelf"
version = "0.1.0"
description = "Local-first media library. Files stay on this machine."
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
walkdir = "2.5.0"
kamadak-exif = "0.6.1"
sha2 = "0.11.1"
thiserror = "2.0.21"
tauri-plugin-dialog = "2.8.4"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "gif"] }
ort = "=2.0.0-rc.15"
ndarray = "0.17"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ureq = "2.12"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
